[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
flatart-domain = { path = "crates/flatart-domain" }
flatart-ports = { path = "crates/flatart-ports" }
flatart-pipeline = { path = "crates/flatart-pipeline" }

# External crates (each one is used only inside its own adapter or wiring crate)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.130"
console_error_panic_hook = "0.1.7"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6.5"

# Test-only
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
