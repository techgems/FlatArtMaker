[package]
name = "flatart-3mf"
description = "Exporter<MeshModel> for 3MF, plus the prusa and bambu SlicerDialects. zip, quick-xml and png stay inside this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flatart-domain.workspace = true
flatart-ports.workspace = true
quick-xml = "0.42.0"
png = "0.18.1"
# Deflate only, through the pure-Rust zlib-rs backend, so it builds for WASM.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
flatart-ports = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
