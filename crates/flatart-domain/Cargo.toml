[package]
name = "flatart-domain"
description = "FlatArtMaker data types. No third-party types beyond serde/thiserror (plus tsify declarations behind the `tsify` feature)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TypeScript declarations for the types the browser sees, generated by tsify.
# Only the browser wiring (flatart-wasm) turns this on.
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
