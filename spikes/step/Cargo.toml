# Throwaway spike for task 03 (STEP export with truck). Not part of the root workspace.
[package]
name = "step-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Empty table: keeps this package out of the root workspace.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "step-check"
path = "src/bin/step-check.rs"
required-features = ["read"]

[features]
default = ["read"]
# STEP reader (ruststep) for validation; not needed by the writer or the wasm build.
read = ["truck-stepio/in", "truck-stepio/derive"]  # `in` alone does not compile: it needs `derive`

# truck master, pinned. Commit 55548a27de0af3e87cceeb677b809aa110a87028 (2026-11-02).
[dependencies]
truck-modeling = { git = "https://github.com/ricosjp/truck", rev = "55548a27de0af3e87cceeb677b809aa110a87028" }
truck-topology = { git = "https://github.com/ricosjp/truck", rev = "55548a27de0af3e87cceeb677b809aa110a87028" }
truck-assembly = { git = "https://github.com/ricosjp/truck", rev = "55548a27de0af3e87cceeb677b809aa110a87028" }
truck-stepio = { git = "https://github.com/ricosjp/truck", rev = "55548a27de0af3e87cceeb677b809aa110a87028", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same version as the cached wasm-bindgen CLI (wasm-pack cache) and the root workspace.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
